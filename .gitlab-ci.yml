# ============================================================================
# spasa-video-restreamer — build & publish the sidecar image to the GitLab
# Container Registry on every `vX.Y.Z` tag.
# ============================================================================
# Consumed by SPASA via docker-compose.streamer-registry.yml (Opción 3): SPASA
# only references the image with `image:` — no source, no build, on its hosts.
#
# Predefined variables ($CI_REGISTRY*, $CI_JOB_TOKEN) are injected by GitLab —
# you do NOT define any secret to push to this project's OWN registry.
#
# Requires (one-time infra on the self-hosted GitLab):
#   - Container Registry enabled in gitlab.rb.
#   - A registered GitLab Runner with the Docker executor.
#
# Trigger:  git tag v1.0.0 && git push origin v1.0.0
# Result:   $CI_REGISTRY_IMAGE:v1.0.0  and  :latest
# ============================================================================

stages:
  - build

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"   # let dind set up TLS for the daemon socket
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'   # only semver tags
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

